<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <title>seshMan</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="titlebar">
      <span class="logo">&gt;_&lt;</span>
      <span class="app-name">seshMan</span>
      <div id="search-wrap">
        <input id="search" type="text" placeholder="search sessions…" spellcheck="false" />
        <button id="search-clear" class="hidden" title="Clear search" aria-label="Clear search">×</button>
      </div>
      <span id="session-count">scanning…</span>
      <button id="settings-toggle" title="Settings" aria-label="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
      <button id="grid-toggle" title="Toggle grid overview">⊞ grid</button>
      <button id="board-toggle" title="Agent bulletin board">▤ board</button>
      <button id="queue-toggle" title="Prompt queue">queue</button>
      <div class="winctrl-spacer"></div>
    </div>

    <div id="app">
      <aside id="sidebar">
        <header id="sidebar-header">
          <div class="subtitle-row">
            <div class="hdr-controls">
              <select id="sort-mode" title="Sort sessions by">
                <option value="recent">recent</option>
                <option value="popular">popular</option>
                <option value="longest">longest</option>
              </select>
              <select id="source-filter" title="Filter by session source">
                <option value="both">both</option>
                <option value="cli">cli</option>
                <option value="desktop">desktop</option>
              </select>
            </div>
            <div id="view-menu-wrap">
              <button id="view-toggle" title="Show / hide sessions" aria-label="Show / hide sessions">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
              <div id="view-menu" class="hidden">
                <label class="vm-item">
                  <input type="checkbox" id="vm-hide-inactive" />
                  <span>Hide inactive sessions</span>
                </label>
                <label class="vm-item">
                  <input type="checkbox" id="vm-hide-archived" />
                  <span>Hide archived</span>
                  <span id="vm-archived-count" class="vm-count"></span>
                </label>
              </div>
            </div>
          </div>
        </header>
        <div id="session-list"></div>
        <footer id="sidebar-footer">
          <button id="new-session">+ New session here…</button>
        </footer>
      </aside>

      <main id="main">
        <div id="pane-header" class="empty">
          <div class="pane-titles">
            <span id="pane-title"></span>
            <div class="pane-sub-row">
              <span id="pane-sub"></span>
              <span id="pane-model" class="hidden"></span>
            </div>
          </div>
          <span id="pane-close" title="Close session">×</span>
        </div>
        <div id="terminals">
          <div id="empty-state">
            <div class="empty-glyph">&gt;_&lt;</div>
            <p>Select a session on the left to attach a live terminal.</p>
            <p class="hint">Green = idle · Amber = busy · Grey = not running</p>
          </div>
        </div>
      </main>

      <aside id="queue-pane" class="collapsed">
        <header id="queue-header">
          <span class="queue-title">Prompt Queue</span>
        </header>
        <div id="queue-bookmarks">
          <select id="bookmark-select" title="Insert a saved prompt">
            <option value="">★ insert saved…</option>
          </select>
          <button id="bookmark-manage" title="Manage saved prompts">manage</button>
        </div>
        <div id="queue-target"></div>
        <div id="queue-list"></div>
      </aside>
    </div>

    <div id="grid-view"></div>

    <div id="board-view">
      <aside id="board-topics"></aside>
      <section id="board-main">
        <header id="board-thread-head">
          <span id="board-thread-title"></span>
          <span class="board-head-actions">
            <select id="board-nudge-select" title="Hosted session to nudge"></select>
            <button id="board-nudge" title="Ask this session to read the topic and respond">nudge</button>
            <button id="board-topic-delete" title="Delete every note in this topic">delete topic…</button>
          </span>
        </header>
        <div id="board-thread"></div>
        <footer id="board-composer">
          <div id="board-reply-hint" class="hidden" title="Click to cancel the reply"></div>
          <div class="board-compose-row">
            <input id="board-topic-input" list="board-topic-datalist" placeholder="topic (kebab-case)"
                   spellcheck="false" />
            <datalist id="board-topic-datalist"></datalist>
            <select id="board-to" title="Address the note to a specific session">
              <option value="">to: anyone</option>
            </select>
            <button id="board-post" title="Post as a user note (Ctrl+Enter)">post note</button>
          </div>
          <textarea id="board-text" placeholder="leave a note for the agents… (posted as Harvey)"
                    spellcheck="false"></textarea>
        </footer>
      </section>
    </div>

    <div id="bookmark-modal" class="hidden">
      <div class="bm-card">
        <div class="bm-head">
          <span>Saved Prompts</span>
          <button id="bm-close" title="Close">×</button>
        </div>
        <div id="bm-list"></div>
      </div>
    </div>

    <div id="settings-modal" class="hidden">
      <div class="bm-card st-card">
        <div class="bm-head">
          <span>Settings</span>
          <button id="st-close" title="Close">×</button>
        </div>
        <div id="st-body">
          <label class="st-row">
            <span class="st-label">theme</span>
            <select id="st-theme">
              <option value="dark">dark</option>
              <option value="light">light</option>
            </select>
          </label>
          <label class="st-row">
            <span class="st-label">terminal font</span>
            <input id="st-font" type="text" list="st-font-presets" spellcheck="false"
                   placeholder="Cascadia Code" />
            <datalist id="st-font-presets">
              <option value="Cascadia Code"></option>
              <option value="Cascadia Mono"></option>
              <option value="Consolas"></option>
              <option value="JetBrains Mono"></option>
              <option value="Fira Code"></option>
              <option value="IBM Plex Mono"></option>
              <option value="Courier New"></option>
            </datalist>
          </label>
          <label class="st-row">
            <span class="st-label">terminal font size</span>
            <input id="st-size" type="number" min="8" max="28" step="1" />
            <span class="st-hint">ctrl + / − anywhere</span>
          </label>
          <div class="st-note">changes apply instantly and are saved</div>
        </div>
      </div>
    </div>

    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
